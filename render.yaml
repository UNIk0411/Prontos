services:
  - type: web
    name: prontos-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PRONTOS_ENV
        value: production
      - key: PRONTOS_DATABASE_URL
        sync: false
      - key: PRONTOS_JWT_SECRET
        generateValue: true
      - key: PRONTOS_CORS_ORIGINS
        sync: false
      - key: PRONTOS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: PRONTOS_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: PRONTOS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
